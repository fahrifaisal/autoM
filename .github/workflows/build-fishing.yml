name: Nuitka Build Compilation Pipeline

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-production-binaries:
    name: Build Dual-Target Windows Binaries
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Microsoft Visual C++ Compiler Toolset
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Application Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy opencv-python dxcam configparser
        pip install nuitka

    - name: Build Variant 1 - Silent Stealth Binary (No-Console)
      run: |
        nuitka --standalone --onefile --windows-disable-console --lto=yes --output-filename=WinHostNetworkStorageService fishing.py

    - name: Build Variant 2 - Diagnostic Debug Binary (With-Console)
      run: |
        nuitka --standalone --onefile --lto=yes --output-filename=HostDiagnosticToolService fishing.py

    - name: Verify Compiled Artifacts Presence
      run: |
        if (Test-Path "WinHostNetworkStorageService.exe") { Write-Output "Stealth Binary Verified Successfully" } else { throw "Stealth Binary Generation Failed" }
        if (Test-Path "HostDiagnosticToolService.exe") { Write-Output "Debug Binary Verified Successfully" } else { throw "Debug Binary Generation Failed" }

    - name: Upload Compiled Production Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Production-Target-Binaries
        path: |
          WinHostNetworkStorageService.exe
          HostDiagnosticToolService.exe
        if-no-files-found: error
        retention-days: 7
