name: Nuitka-Fishing

on:
  workflow_dispatch:

permissions:
  contents: write
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-production-binaries:
    name: Build Dual-Target Windows Binaries
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Application Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy opencv-python dxcam configparser

    # # VARIANT 1: SILENT STEALTH BINARY (NO-CONSOLE / SENYAP RUNTIME)
    # - name: Compile Variant 1 - Silent Stealth Binary
    #   uses: Nuitka/Nuitka-Action@main
    #   with:
    #     nuitka-version: main
    #     script-name: fishing.py
    #     mode: onefile
    #     lto: yes
    #     enable-plugins: anti-bloat
    #     windows-console-mode: disable
    #     output-file: WinHostNetworkStorageService.exe

    # VARIANT 1: DIAGNOSTIC DEBUG BINARY (WITH-CONSOLE / BISA LOG MONITOR)
    - name: Compile Diagnostic Debug Binary
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: fishing.py
        mode: onefile
        lto: yes
        enable-plugins: anti-bloat
        windows-console-mode: force
        output-file: HostDiagnosticToolService.exe

    - name: Verify Compiled Artifacts Presence
      run: |
        if (Test-Path "build/HostDiagnosticToolService.exe") { Write-Output "Debug Binary Verified" } else { throw "Debug Binary Missing" }
        
     # NEW STEP: Automatically creates a permanent release and uploads the .exe
    - name: Create Permanent GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Generates a unique tag based on the current timestamp to avoid naming conflicts
        $RELEASE_TAG = "v" + (Get-Date -Format "yyyyMMdd-HHmmss")
        
        gh release create $RELEASE_TAG build/HostDiagnosticToolService.exe `
          --title "Fishing Build $RELEASE_TAG" `
          --notes "Automated binary release from workflow dispatch."
          
    - name: Upload Compiled Production Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Production-Target-Binaries
        path: |
          build/HostDiagnosticToolService.exe
        if-no-files-found: error
        retention-days: 7
