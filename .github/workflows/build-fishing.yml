name: Nuitka Build Compilation Pipeline

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-production-binaries:
    name: Build Dual-Target Windows Binaries
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Application Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy opencv-python dxcam configparser

    # VARIANT 1: SILENT STEALTH BINARY (NON-CONSOLE / SENYAP MUTLAK)
    - name: Compile Variant 1 - Silent Stealth Binary (Non-Console)
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: fishing.py
        mode: standalone
        output-file: WinHostNetworkStorageService.exe
        extra-options: |
          --onefile
          --lto=yes
          --windows-console-mode=disable

    # VARIANT 2: DIAGNOSTIC DEBUG BINARY (WITH-CONSOLE / UNTUK TES TIMING)
    - name: Compile Variant 2 - Diagnostic Debug Binary (With-Console)
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: fishing.py
        mode: standalone
        output-file: HostDiagnosticToolService.exe
        extra-options: |
          --onefile
          --lto=yes
          --windows-console-mode=force

    # Verifikasi hasil kompilasi di folder output default Nuitka-Action (build/)
    - name: Verify Compiled Artifacts Presence
      run: |
        if (Test-Path "build/WinHostNetworkStorageService.exe") { Write-Output "Stealth Binary Verified Successfully" } else { throw "Stealth Binary Missing" }
        if (Test-Path "build/HostDiagnosticToolService.exe") { Write-Output "Debug Binary Verified Successfully" } else { throw "Debug Binary Missing" }

    # Mengompres dan mengunggah hasil menjadi berkas .zip yang bisa langsung diunduh
    - name: Upload Compiled Production Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Production-Target-Binaries
        path: |
          build/WinHostNetworkStorageService.exe
          build/HostDiagnosticToolService.exe
        if-no-files-found: error
        retention-days: 7
