name: Build FishingM

# Mengubah trigger dari otomatis (push) menjadi manual
on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python numpy dxcam pyarmor pyinstaller

    - name: Obfuscate Code with PyArmor
      run: |
        pyarmor gen -O obfuscated fishing.py

    - name: Build with PyInstaller
      run: |
        # Membangun EXE dari file yang sudah diobfusikasi
        pyinstaller --onefile --name FishingM obfuscated/fishing.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FishingM-Protected-EXE
        path: dist/FishingM.exe
