name: Windows Core Telemetry Diagnostic Pipeline

on:
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab Actions GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 1. Checkout Source Code
      uses: actions/checkout@v4

    - name: 2. Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: 3. Setup vcpkg Package Manager
      uses: johnwason/vcpkg-action@v6
      with:
        pkgs: opencv4
        triplet: x64-windows-static
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 4. Configure CMake Architecture
      run: cmake -B build -S . "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_BUILD_TYPE=Release
        
    - name: 5. Execute Hardware-Level Native Compilation
      run: |
        cmake --build build --config Release

    - name: 6. Inject Random Junk Byte (Polymorphic Hash)
      shell: powershell
      run: |
        # Mengendus lokasi asli berkas .exe secara rekursif di dalam folder build
        $exePath = (Get-ChildItem -Path "build" -Filter "WinTelemetryService.exe" -Recurse | Select-Object -First 1).FullName
        if ($exePath) {
            $junk = [byte[]](1..64 | ForEach-Object { Get-Random -Min 0 -Max 255 })
            Add-Content -Path $exePath -Value $junk -Encoding Byte
            Write-Host "[✅] Successfully customized binary signature hash at: $exePath"
        } else {
            Write-Error "[🚨] WinTelemetryService.exe not found in build tree!"
            exit 1
        }

    - name: 7. Upload Stealth Artifact Binary
      uses: actions/upload-artifact@v4
      with:
        name: WinTelemetryService_Release_Binaries
        # Menggunakan wildcard (**/) agar GitHub otomatis melacak lokasi .exe di folder mana pun
        path: build/**/WinTelemetryService.exe
